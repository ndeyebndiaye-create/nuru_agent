services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nuru
      POSTGRES_PASSWORD: nuru_password
      POSTGRES_DB: nuru
    ports:
      - "5433:5432"   # port hôte 5433 (5432 déjà occupé par un autre projet) ; port interne inchangé
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://nuru:nuru_password@postgres:5432/nuru
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: gemini-1.5-pro
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  qdrant_data:
  postgres_data:
